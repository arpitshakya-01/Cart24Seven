services:
  - type: web
    name: cart24seven-api
    runtime: docker
    rootDir: easycart-backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: APP_FRONTEND_ORIGIN
        value: https://cart24seven-site.onrender.com
      - key: CART24SEVEN_JWT_SECRET
        generateValue: true
      - key: CART24SEVEN_ADMIN_EMAIL
        sync: false
      - key: CART24SEVEN_ADMIN_PASSWORD
        sync: false
      - key: CART24SEVEN_ADMIN_NAME
        value: Site Administrator
      - key: FILE_UPLOAD_DIR
        value: /app/uploads
      - key: SPRING_SQL_INIT_MODE
        value: always

  - type: web
    name: cart24seven-site
    runtime: static
    rootDir: easycart-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: cart24seven-api
          envVarKey: RENDER_EXTERNAL_URL