# ==================================================
# CART24SEVEN - APPLICATION CONFIGURATION
# ==================================================

spring.application.name=cart24seven-backend

# ==================================================
# MYSQL DATABASE
# ==================================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/easycart_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always

# ==================================================
# ==================================================


# ==================================================
# SERVER
# ==================================================

server.port=${PORT:8080}

# ==================================================
# FILE UPLOAD SETTINGS
# ==================================================

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Upload folder
file.upload-dir=uploads

# Serve uploads as static resources
spring.web.resources.static-locations=classpath:/static/,file:uploads/

# ==================================================
# LOGGING
# ==================================================

logging.level.org.springframework.web=DEBUG
# Optional first admin setup (set environment variables before starting the backend)
app.bootstrap.admin-email=${CART24SEVEN_ADMIN_EMAIL:}
app.bootstrap.admin-password=${CART24SEVEN_ADMIN_PASSWORD:}
app.bootstrap.admin-name=${CART24SEVEN_ADMIN_NAME:Administrator}
# Keep the signing key outside source control and provide it as an environment variable.
app.jwt.secret=${CART24SEVEN_JWT_SECRET}

# Optional Razorpay gateway keys. Leave unset to keep online payments disabled.
app.payment.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.payment.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.payment.demo.enabled=${CART24SEVEN_DEMO_PAYMENTS_ENABLED:true}



